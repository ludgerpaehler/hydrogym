name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-core:
    name: pure-python (core + data_manager + lazy-import + public-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install base + dev
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-mock
      - name: Run pure-Python tests
        # No --cov here: coverage.py pre-imports the measured package, which
        # races numpy 2.x init against conftest's own `import numpy` and
        # triggers "cannot load module more than once per process". Coverage
        # is nice-to-have, not required for regression detection.
        run: |
          python -m pytest -v test/test_public_api_surface.py test/core test/data_manager test/lazy_import \
            -m "not requires_firedrake and not requires_maia and not requires_nek and not requires_jaxfluids and not requires_jax"

  pytest-jax:
    name: jax backend (pip-installable on plain ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with [jax] extra in an isolated venv
        # The [jax] extra transitively pulls tfp-nightly (via gymnax →
        # rlax → distrax → tensorflow-probability), which races numpy 2.x
        # init in setup-python's shared site-packages and triggers
        # `ImportError: cannot load module more than once per process` at
        # conftest load. Putting everything in a fresh venv eliminates
        # the multi-load condition.
        run: |
          python -m venv .venv-jax
          .venv-jax/bin/pip install --upgrade pip
          .venv-jax/bin/pip install -e ".[jax]"
          .venv-jax/bin/pip install pytest pytest-cov pytest-mock
      - name: Run JAX tests
        # See note in pytest-core job: --cov dropped because coverage.py's
        # pre-import of the measured package races numpy 2.x init.
        run: |
          .venv-jax/bin/python -m pytest -v test/jax \
            -m "requires_jax"

  pytest-mpi-pure-python:
    name: maia + nek pure-python surface (no mpirun, no native binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system MPI for mpi4py
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
      - name: Install with [maia] + [nek] extras
        run: |
          python -m pip install --upgrade pip
          # The .[maia] and .[nek] extras carry exactly the pure-Python
          # transitive deps (einops, omegaconf, toml, pymech, pettingzoo,
          # stable-baselines3, supersuit, tensorboard) that the wrappers
          # import eagerly. mpi4py is built against the apt-installed OpenMPI.
          pip install -e ".[maia,nek]"
          pip install pytest pytest-cov pytest-mock
      - name: Run MAIA/NEK pure-Python tests (no mpirun)
        run: |
          python -m pytest -v test/maia test/nek \
            -m "requires_maia or requires_nek"
